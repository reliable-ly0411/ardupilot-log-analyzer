name: Qt regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 5 and build tools
        run: sudo apt-get update && sudo apt-get install -y qtbase5-dev qt5-qmake fonts-noto-cjk
      - name: Generate reproducible DataFlash fixtures
        run: python3 测试/generate_fixtures.py
      - name: Build
        run: |
          mkdir -p build
          cd build
          qmake ../源码/ArduPilotLogAnalyzer.pro
          make -j2
      - name: Run parser and UI regression
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/ArduPilotLogAnalyzer --self-test 测试 验证/regression.json
      - name: Save regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-regression
          path: 验证/
          if-no-files-found: error
